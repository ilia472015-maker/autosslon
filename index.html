<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>АвтоРынок</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;}
  body { background: #0f1115; color: #fff; padding-bottom: 30px; min-height: 100vh; overflow-x: hidden; }
  
  /* Шапка */
  header { position: sticky; top:0; z-index:10; background: rgba(26,29,36,0.95); backdrop-filter: blur(10px); padding: 12px 16px; display:flex; justify-content:space-between; align-items:center; box-shadow: 0 2px 12px rgba(0,0,0,.5); gap: 10px; }
  header h1 { font-size: 16px; letter-spacing:.5px; white-space: nowrap; }
  header h1 span { color:#4da3ff; }
  
  .header-right { display: flex; gap: 8px; align-items: center; }
  .header-wallet, .header-garage { background:#1e2a3a; padding:8px 12px; border-radius:20px; font-size:13px; font-weight:600; color:#4da3ff; border:1px solid #2c4a6e; display:flex; align-items:center; gap:4px; cursor:pointer; transition: 0.2s; }
  .header-wallet:active, .header-garage:active { transform: scale(0.95); }
  .header-garage { color: #ffd94d; border-color: #5c4a1e; background: #2a241e; }

  /* Сетка машин */
  .cars { padding:16px; display:flex; flex-direction:column; gap:18px; }
  .car { background:#181b22; border-radius:18px; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,.45); border:1px solid #232833; animation: fadeIn .4s ease; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;} }
  .car img { width:100%; height:200px; object-fit:cover; display:block; background: #232833; }
  .car-info { padding:16px; }
  .car-name { font-size:18px; font-weight:800; margin-bottom:6px; color: #fff; }
  .car-desc { font-size:13px; color:#8b93a3; margin-bottom:14px; line-height: 1.4; }
  .car-bottom { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .price { font-size:18px; font-weight:800; color:#ffd94d; }
  .buy-btn { background:linear-gradient(135deg,#4da3ff,#2f7de0); border:none; color:#fff; padding:12px 22px; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; transition: transform .12s; flex-shrink:0; }
  .buy-btn:active { transform:scale(.94); }

  /* Модальные окна */
  .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.3s; }
  .modal-overlay.active { display: flex; opacity: 1; }
  .modal-content { background: #1c2029; width: 100%; max-width: 420px; border-radius: 24px; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); border: 1px solid #2c3443; transform: translateY(20px); transition: transform 0.3s; max-height: 90vh; overflow-y: auto; }
  .modal-overlay.active .modal-content { transform: translateY(0); }
  .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 10px; text-align: center; }
  .modal-text { color: #8b93a3; text-align: center; margin-bottom: 20px; font-size: 14px; }
  
  /* Окно подтверждения */
  .confirm-img { width: 100%; height: 180px; object-fit: cover; border-radius: 16px; margin-bottom: 15px; }
  .confirm-price { font-size: 26px; font-weight: 900; color: #ffd94d; text-align: center; margin-bottom: 20px; }
  .confirm-btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
  .confirm-btn:active { transform: scale(0.97); }
  .btn-green { background: #22c55e; color: #fff; box-shadow: 0 4px 15px rgba(34,197,94,0.4); }
  .btn-blue { background: #3b82f6; color: #fff; box-shadow: 0 4px 15px rgba(59,130,246,0.4); }
  .btn-grey { background: #2c3443; color: #fff; }

  /* Кнопки в модалке пополнения */
  .deposit-btn { width: 100%; padding: 15px; background: #232833; border: 1px solid #333; border-radius: 12px; margin-bottom: 10px; cursor: pointer; color: #fff; font-size: 16px; font-weight: 700; text-align: left; display: flex; justify-content: space-between; }
  .deposit-btn:active { background: #2c3443; }
  .deposit-btn span:last-child { color: #22c55e; }

  /* Мои покупки */
  .garage-item { display: flex; align-items: center; background: #232833; border-radius: 12px; padding: 10px; margin-bottom: 10px; border: 1px solid #333; }
  .garage-img { width: 70px; height: 50px; object-fit: cover; border-radius: 8px; margin-right: 12px; }
  .garage-info { flex-grow: 1; }
  .garage-name { font-size: 15px; font-weight: 700; }
  .garage-price { font-size: 12px; color: #ffd94d; }

  .close-btn { width: 100%; padding: 14px; background: transparent; border: none; color: #8b93a3; font-size: 15px; font-weight: 600; margin-top: 10px; cursor: pointer; }

  /* Уведомление */
  .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(20px); background:#232833; color:#fff; padding:12px 22px; border-radius:12px; font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:.3s; z-index:300; border:1px solid #2f3a4a; box-shadow:0 6px 20px rgba(0,0,0,.5); white-space:nowrap; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>🏁 Авто<span>Рынок</span></h1>
  <div class="header-right">
    <div class="header-garage" id="garageBtn">🏆 Гараж</div>
    <div class="header-wallet" id="walletBtn">
      <span id="balance">0 ₽</span>
    </div>
  </div>
</header>

<div class="cars" id="cars"></div>

<!-- Окно ПОДТВЕРЖДЕНИЯ покупки -->
<div class="modal-overlay" id="payModal">
  <div class="modal-content">
    <div class="modal-title" id="payModalTitle">Покупка</div>
    <img src="" id="confirmImg" class="confirm-img">
    <div class="modal-text" id="payModalText">Характеристики...</div>
    <div class="confirm-price" id="payModalPrice">0 ₽</div>
    
    <button class="confirm-btn btn-green" id="payWithCard">
      💳 Оплатить с карты
    </button>
    
    <button class="confirm-btn btn-blue" id="payWithBonus">
      🎁 Оплатить бонусами
    </button>
    
    <button class="confirm-btn btn-grey" id="closePayModal">Отмена</button>
  </div>
</div>

<!-- Окно ПОПОЛНЕНИЯ -->
<div class="modal-overlay" id="depositModal">
  <div class="modal-content">
    <div class="modal-title">Пополнение счета</div>
    <div class="modal-text">Выберите сумму для зачисления</div>
    
    <button class="deposit-btn" data-amount="100000"><span>+ 100 000 ₽</span><span>💵</span></button>
    <button class="deposit-btn" data-amount="500000"><span>+ 500 000 ₽</span><span>💵</span></button>
    <button class="deposit-btn" data-amount="1000000"><span>+ 1 000 000 ₽</span><span>💵</span></button>
    <button class="deposit-btn" data-amount="5000000"><span>+ 5 000 000 ₽</span><span>💵</span></button>
    
    <div style="margin-top: 15px; border-top: 1px solid #333; padding-top: 15px;">
        <button class="deposit-btn" id="addBonusBtn"><span>🎁 + 100 000 бонусов</span><span>✨</span></button>
    </div>
    
    <button class="close-btn" id="closeDepositModal">Закрыть</button>
  </div>
</div>

<!-- Окно МОИ ПОКУПКИ (Гараж) -->
<div class="modal-overlay" id="garageModal">
  <div class="modal-content">
    <div class="modal-title">Мой Гараж</div>
    <div class="modal-text" id="garageEmptyText" style="display:none;">У вас пока нет купленных машин</div>
    <div id="garageList"></div>
    <button class="close-btn" id="closeGarageModal">Закрыть</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // Данные машин (с точными картинками)
  const cars = [
    { id:1, name:"ВАЗ 2107", desc:"Бюджетный седан • 1.6 л • 75 л.с. • 2005 г.", price:100000, img:"https://images.unsplash.com/photo-1590522013916-719f9f8b8a1a?w=800&q=80" },
    { id:2, name:"Daewoo Matiz", desc:"Городской хэтчбек • 0.8 л • 51 л.с. • 2010 г.", price:250000, img:"https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?w=800&q=80" },
    { id:3, name:"ВАЗ 2106 (Битый)", desc:"После ДТП • На запчасти", price:50000, img:"https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=800&q=80" },
    { id:4, name:"Ford Focus (Разбит)", desc:"Разбит передок • Двигатель цел • 2008 г.", price:150000, img:"https://images.unsplash.com/photo-1590362891991-f776e747a588?w=800&q=80" },
    { id:5, name:"Yamaha YZF-R1", desc:"Спортбайк • 1.0 л • 200 л.с. • 2021 г.", price:1200000, img:"https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=800&q=80" },
    { id:6, name:"Harley-Davidson", desc:"Круизер • 1.8 л • 90 л.с. • 2020 г.", price:1800000, img:"https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=800&q=80" },
    { id:7, name:"КамАЗ 5490", desc:"Тягач • Дизель • 400 л.с. • 2019 г.", price:4500000, img:"https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?w=800&q=80" },
    { id:8, name:"ПАЗ Вектор Next", desc:"Автобус • Дизель • 25 мест • 2021 г.", price:3200000, img:"https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=800&q=80" },
    { id:9, name:"Toyota Camry", desc:"Бизнес-седан • 2.5 л • 200 л.с. • 2022 г.", price:3500000, img:"https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?w=800&q=80" },
    { id:10, name:"BMW M4 Competition", desc:"3.0 л • 510 л.с. • 2023 г.", price:7500000, img:"https://images.unsplash.com/photo-1555215695-3004980ad54e?w=800&q=80" },
    { id:11, name:"Mercedes-Benz G-Class", desc:"4.0 л V8 • 585 л.с. • 2022 г.", price:12500000, img:"https://images.unsplash.com/photo-1520031441872-265e4ff70366?w=800&q=80" },
    { id:12, name:"Porsche 911 Turbo S", desc:"3.8 л • 650 л.с. • 2022 г.", price:15900000, img:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=800&q=80" },
    { id:13, name:"Lamborghini Huracán", desc:"5.2 л V10 • 640 л.с. • 2022 г.", price:21000000, img:"https://images.unsplash.com/photo-1544636331-e26879cd4d9b?w=800&q=80" },
    { id:14, name:"Ferrari 488 GTB", desc:"3.9 л V8 • 670 л.с. • 2021 г.", price:24500000, img:"https://images.unsplash.com/photo-1592198084033-aade902d1aae?w=800&q=80" }
  ];

  // Состояние
  let balance = parseInt(localStorage.getItem('salonBalance')) || 50000;
  let bonuses = parseInt(localStorage.getItem('salonBonuses')) || 0; 
  const bought = new Set(JSON.parse(localStorage.getItem('salonBought') || '[]'));
  let currentBuyCar = null;

  // Элементы
  const fmt = n => n.toLocaleString('ru-RU') + ' ₽';
  const balEl = document.getElementById('balance');
  const carsEl = document.getElementById('cars');
  const toastEl = document.getElementById('toast');

  function save() {
    localStorage.setItem('salonBalance', balance);
    localStorage.setItem('salonBonuses', bonuses);
    localStorage.setItem('salonBought', JSON.stringify([...bought]));
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast.t);
    showToast.t = setTimeout(() => toastEl.classList.remove('show'), 2500);
  }

  function render() {
    // Обновляем кошелек
    balEl.innerHTML = `${fmt(balance)} <span style="font-size:11px; color:#22c55e; margin-left: 4px;">+${fmt(bonuses)}</span>`;
    
    // Рендер машин (только тех, что НЕ куплены)
    carsEl.innerHTML = '';
    let availableCars = cars.filter(car => !bought.has(car.id));
    
    if (availableCars.length === 0) {
        carsEl.innerHTML = '<div style="text-align:center; color:#8b93a3; padding: 40px 0;">Вы скупили весь авторынок! 🏆</div>';
    }

    availableCars.forEach(car => {
      const div = document.createElement('div');
      div.className = 'car';
      div.innerHTML = `
        <img src="${car.img}" alt="${car.name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=800&q=80'">
        <div class="car-info">
          <div class="car-name">${car.name}</div>
          <div class="car-desc">${car.desc}</div>
          <div class="car-bottom">
            <div class="price">${fmt(car.price)}</div>
            <button class="buy-btn" data-id="${car.id}">Купить</button>
          </div>
        </div>`;
      carsEl.appendChild(div);
    });

    carsEl.querySelectorAll('.buy-btn').forEach(btn => {
      btn.addEventListener('click', () => openPayModal(parseInt(btn.dataset.id)));
    });

    // Рендер гаража
    const garageList = document.getElementById('garageList');
    const garageEmptyText = document.getElementById('garageEmptyText');
    garageList.innerHTML = '';
    
    if (bought.size === 0) {
      garageEmptyText.style.display = 'block';
    } else {
      garageEmptyText.style.display = 'none';
      cars.filter(c => bought.has(c.id)).forEach(car => {
        garageList.innerHTML += `
          <div class="garage-item">
            <img src="${car.img}" class="garage-img">
            <div class="garage-info">
              <div class="garage-name">${car.name}</div>
              <div class="garage-price">Куплено за ${fmt(car.price)}</div>
            </div>
          </div>
        `;
      });
    }
  }

  // Открытие окна подтверждения
  function openPayModal(id) {
    const car = cars.find(c => c.id === id);
    if (!car || bought.has(id)) return;
    
    currentBuyCar = car;
    document.getElementById('payModalTitle').textContent = car.name;
    document.getElementById('confirmImg').src = car.img;
    document.getElementById('payModalText').textContent = car.desc;
    document.getElementById('payModalPrice').textContent = `Цена: ${fmt(car.price)}`;
    
    document.getElementById('payModal').classList.add('active');
  }

  // Закрытие окон
  document.getElementById('closePayModal').onclick = () => document.getElementById('payModal').classList.remove('active');
  document.getElementById('closeDepositModal').onclick = () => document.getElementById('depositModal').classList.remove('active');
  document.getElementById('closeGarageModal').onclick = () => document.getElementById('garageModal').classList.remove('active');

  // Оплата картой
  document.getElementById('payWithCard').onclick = () => {
    if (!currentBuyCar) return;
    if (balance < currentBuyCar.price) {
      showToast(`Не хватает ${fmt(currentBuyCar.price - balance)} на карте`);
      return;
    }
    balance -= currentBuyCar.price;
    const cashback = currentBuyCar.price * 0.05;
    bonuses += cashback;
    bought.add(currentBuyCar.id);
    save(); render();
    document.getElementById('payModal').classList.remove('active');
    showToast(`🎉 Куплено! Кэшбэк: ${fmt(cashback)}`);
  };

  // Оплата бонусами
  document.getElementById('payWithBonus').onclick = () => {
    if (!currentBuyCar) return;
    if (bonuses < currentBuyCar.price) {
      showToast(`Не хватает ${fmt(currentBuyCar.price - bonuses)} бонусов`);
      return;
    }
    bonuses -= currentBuyCar.price;
    bought.add(currentBuyCar.id);
    save(); render();
    document.getElementById('payModal').classList.remove('active');
    showToast(`🎉 Куплено за бонусы!`);
  };

  // Открытие кошелька и гаража
  document.getElementById('walletBtn').onclick = () => document.getElementById('depositModal').classList.add('active');
  document.getElementById('garageBtn').onclick = () => document.getElementById('garageModal').classList.add('active');

  // Пополнение
  document.querySelectorAll('.deposit-btn[data-amount]').forEach(btn => {
    btn.onclick = () => {
      const amount = parseInt(btn.dataset.amount);
      balance += amount;
      save(); render();
      showToast(`+${fmt(amount)} зачислено`);
    };
  });

  document.getElementById('addBonusBtn').onclick = () => {
    bonuses += 100000;
    save(); render();
    showToast('+100 000 бонусов зачислено');
  };

  // Инициализация
  render();
</script>
</body>
</html>
